name: Scan for secrets with TruffleHog
description: >
  Scans for leaked secrets with TruffleHog: the commits a branch adds, a
  checkout's whole history, or the files under some paths. Writes JSON,
  SARIF and JUnit reports that name where each secret is, its detector and
  whether it was verified, but never hold any part of the secret itself.
  Secrets at or above fail_on fail the step unless report_only is true. A
  scan that can't complete, reports a scan error, or scanned nothing fails
  either way. TruffleHog never checks a secret with the service it belongs
  to unless verify is true. Run install first. The GitHub Actions twin of
  the orb's scan command; send the SARIF report to code scanning with
  github/codeql-action/upload-sarif.
author: juburr

inputs:
  source:
    description: >
      What to scan. "git" (default) scans commits of the git checkout
      the working directory is in, as scope says, which is what catches
      a secret that was committed and then deleted. "filesystem" scans
      the files under paths as they are now, leaving out .git
      directories.
    default: git
  scope:
    description: >
      Which commits a git scan reads. "changes" (default): the commits
      HEAD adds since it left base_ref, the pull request's base on
      GitHub Actions, or the remote's default branch, so a secret
      already in history doesn't fail every build after it. "history":
      every commit HEAD's history holds. "all": every ref in the
      checkout, other branches and tags included. A shallow checkout has
      only part of the history: check out with all of it
      (actions/checkout: fetch-depth: 0).
    default: changes
  base_ref:
    description: >
      For scope changes: the branch, tag or commit whose code is already
      scanned, such as origin/main. The scan covers the commits since
      HEAD left it (their merge base). Empty: on GitHub Actions, the
      pull request's base, the commit before a push, or the merge
      group's base; otherwise origin/HEAD, origin/main or origin/master.
    default: ""
  max_depth:
    description: >
      For source git: scan at most this many commits, newest first. 0
      (default) has no limit.
    default: "0"
  paths:
    description: >
      For source filesystem: the files and directories to scan,
      separated by commas, spaces or newlines, relative to working_dir.
      Empty scans working_dir.
    default: ""
  verify:
    description: >
      Have TruffleHog check each secret it finds with the service it
      belongs to, such as AWS or GitHub, to see whether it still works.
      That sends every secret found out of this job to that service,
      which may log the attempt, so it is off by default: every secret
      found is then "unverified", or "unknown" when TruffleHog can't
      tell what it is.
    default: "false"
  fail_on:
    description: >
      The least certain result that fails the step. "unverified"
      (default): every secret found. "unknown": secrets verification
      confirmed or could not decide about. "verified": only secrets
      verification confirmed work, which needs verify: true.
    default: unverified
  include_paths:
    description: >
      A file of regular expressions, one per line, that a file's path
      must match to be scanned (TruffleHog's --include-paths).
    default: ""
  exclude_paths:
    description: >
      A file of regular expressions, one per line, for paths not to
      scan, such as test fixtures (TruffleHog's --exclude-paths).
    default: ""
  exclude_globs:
    description: >
      For source git: comma-separated globs of paths git leaves out of
      the diffs TruffleHog reads (--exclude-globs), which is faster than
      exclude_paths for large directories.
    default: ""
  include_detectors:
    description: >
      Detectors to run, such as github or aws, detector type numbers or
      ranges of them, separated by commas or spaces. Empty runs all of
      them.
    default: ""
  exclude_detectors:
    description: >
      Detectors not to run, in the same form as include_detectors.
    default: ""
  config:
    description: >
      A TruffleHog configuration file with custom regular-expression
      detectors. Their results are named CustomRegex.
    default: ""
  no_ignore_tag:
    description: >
      Report secrets that have a trufflehog:ignore comment after them on
      the same line, which TruffleHog otherwise leaves out.
    default: "false"
  allow_empty:
    description: >
      For source filesystem: pass when there is nothing to read under
      paths (every file excluded, empty or unreadable), which otherwise
      fails the step, since nothing was checked.
    default: "false"
  extra_args:
    description: >
      More TruffleHog options, split like shell words: its tuning
      options only, such as --concurrency 4, --detector-timeout 30s,
      --force-skip-binaries, --allow-verification-overlap or
      --trust-local-git-config. Options that decide what is scanned or
      reported are parameters, and are refused here.
    default: ""
  working_dir:
    description: >
      The directory to run in: inside the git checkout to scan, or the
      directory paths are relative to.
    default: "."
  output_dir:
    description: >
      Absolute path of the directory for the reports: <report_name>.json
      (every secret found, without the secret), <report_name>.sarif
      (those in a file, for GitHub code scanning),
      junit/<report_name>.xml and the run record.
    default: "/tmp/trufflehog-reports"
  report_name:
    description: >
      The name every report of this scan starts with, so several scans
      can share output_dir.
    default: trufflehog
  junit:
    description: >
      Write junit/<report_name>.xml, with a failed test for each secret
      at or above fail_on and a skipped one for each below.
    default: "true"
  run_record:
    description: >
      Write <report_name>.run-record.json: what was scanned, with which
      TruffleHog and options, and what it found, as described by
      schemas/run-record.v1.json.
    default: "false"
  report_only:
    description: >
      Pass even when secrets at or above fail_on were found, with a
      warning. A scan that can't complete still fails.
    default: "false"
  store_artifacts:
    description: >
      Upload output_dir as an artifact, even when the scan fails. The
      reports never hold a secret, but they name the files, commits and
      authors where secrets were found.
    default: "true"
  no_output_timeout:
    description: >
      CircleCI's; it has no effect here. Use the job's or step's
      timeout-minutes instead.
    default: 10m

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=trufflehog-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: TruffleHog scan
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_ALLOW_EMPTY: ${{ inputs.allow_empty }}
        PARAM_BASE_REF: ${{ inputs.base_ref }}
        PARAM_CONFIG: ${{ inputs.config }}
        PARAM_EXCLUDE_DETECTORS: ${{ inputs.exclude_detectors }}
        PARAM_EXCLUDE_GLOBS: ${{ inputs.exclude_globs }}
        PARAM_EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_FAIL_ON: ${{ inputs.fail_on }}
        PARAM_INCLUDE_DETECTORS: ${{ inputs.include_detectors }}
        PARAM_INCLUDE_PATHS: ${{ inputs.include_paths }}
        PARAM_JUNIT: ${{ inputs.junit }}
        PARAM_MAX_DEPTH: ${{ inputs.max_depth }}
        PARAM_NO_IGNORE_TAG: ${{ inputs.no_ignore_tag }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_PATHS: ${{ inputs.paths }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_REPORT_ONLY: ${{ inputs.report_only }}
        PARAM_RUN_RECORD: ${{ inputs.run_record }}
        PARAM_SCOPE: ${{ inputs.scope }}
        PARAM_SOURCE: ${{ inputs.source }}
        PARAM_VERIFY: ${{ inputs.verify }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/scan.sh"
        "SCRIPT_TRUFFLEHOG_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/trufflehog.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
