description: >
  Have TruffleHog check each secret it finds with the service it belongs to,
  and fail only on secrets that work or whose check couldn't decide. Each
  secret found is sent to its service to be checked, which is why
  verification is off by default.

usage:
  version: 2.1
  orbs:
    trufflehog: juburr/trufflehog-orb@0.1.0
  jobs:
    secrets:
      docker:
        - image: cimg/base:current
      steps:
        - checkout
        - trufflehog/install
        - trufflehog/scan:
            verify: true
            fail_on: unknown
  workflows:
    secrets:
      jobs:
        - secrets
